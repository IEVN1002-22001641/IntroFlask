{% extends "layout.html" %}
{% block container %}

<h1>Calcular Distancia entre Dos Puntos</h1>

<form action="/distancia" method="post">
    
    <div class="mb-3"> 
        <label for="n1" class="form-label">Número X1:</label>
        <input type="number" step="any" class="form-control" id="n1" name="n1" value="{{n1}}">
    </div>

    <div class="mb-3">
        <label for="n2" class="form-label">Número Y1:</label>
        <input type="number" step="any" class="form-control" id="n2" name="n2" value="{{n2}}">
    </div>

    <div class="mb-3">
        <label for="n3" class="form-label">Número X2:</label>
        <input type="number" step="any" class="form-control" id="n3" name="n3" value="{{n3}}">
    </div>

    <div class="mb-3">
        <label for="n4" class="form-label">Número Y2:</label>
        <input type="number" step="any" class="form-control" id="n4" name="n4" value="{{n4}}">
    </div>
    
    <button type="submit" class="btn btn-primary">Calcular</button>
</form>
  
<h2 class="mt-4">
    La distancia es = {{ res }}
</h2>

{% endblock %}
